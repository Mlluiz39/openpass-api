<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>OpenPass — Configurações</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 28px;
        background: #101116; color: #e8e9ef;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.lead { color: #9aa0b4; margin: 0 0 24px; font-size: 13px; }
      label { display: block; font-weight: 600; margin: 18px 0 6px; font-size: 13px; }
      input[type="text"], input[type="password"] {
        width: 100%; padding: 10px 12px; border-radius: 8px;
        background: #1c1e26; border: 1px solid #2c2e39; color: inherit; font: inherit;
      }
      .hint { color: #9aa0b4; font-size: 12px; margin-top: 6px; }
      .check { display: flex; align-items: center; gap: 8px; margin: 14px 0; font-weight: 500; }
      .row { display: flex; gap: 10px; align-items: center; margin-top: 22px; }
      button {
        padding: 10px 16px; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600;
        background: #21232c; border: 1px solid #2c2e39; color: inherit;
      }
      button.primary { background: #4f7cff; border-color: #4f7cff; color: #fff; }
      #result { margin-top: 16px; font-size: 13px; }
      #result.ok { color: #6ee7a8; }
      #result.err { color: #ff8080; }
      code { background: #1c1e26; padding: 2px 6px; border-radius: 6px; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenPass</h1>
      <p class="lead">
        Conecte a extensão ao seu cofre. A chave de API fica só neste navegador e é enviada
        apenas para o servidor que você informar.
      </p>

      <label for="serverUrl">URL do servidor</label>
      <input id="serverUrl" type="text" placeholder="https://openpass.mlluizdevtech.qzz.io" />
      <div class="hint">Endereço do painel OpenPass, sem barra no final.</div>

      <label for="apiKey">Chave de API</label>
      <input id="apiKey" type="password" placeholder="op_..." />
      <div class="hint">
        Crie em <strong>Painel → Chaves de API</strong> com as permissões
        <code>entries:read</code> e <code>entries:write</code>.
      </div>

      <label class="check"><input id="autoFillOnLoad" type="checkbox" /> Preencher automaticamente ao abrir a página (quando houver só um login)</label>
      <label class="check"><input id="askToSave" type="checkbox" /> Perguntar se quero salvar novos logins</label>

      <div class="row">
        <button class="primary" id="save">Salvar</button>
        <button id="test">Testar conexão</button>
      </div>
      <div id="result"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
